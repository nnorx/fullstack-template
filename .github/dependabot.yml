version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # TODO: update to your GitHub username
    assignees:
      - "nnorx"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group all non-major updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Frontend major updates
      vite-major:
        patterns:
          - "vite*"
          - "@vitejs/*"
        update-types:
          - "major"
      ui-major:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "tw-animate-css"
          - "sonner"
        update-types:
          - "major"
      tanstack-major:
        patterns:
          - "@tanstack/*"
        update-types:
          - "major"
      # Backend major updates
      hono-major:
        patterns:
          - "hono"
          - "hono-rate-limiter"
          - "@hono/*"
        update-types:
          - "major"
      drizzle-major:
        patterns:
          - "drizzle-*"
        update-types:
          - "major"
      # Cross-cutting major updates
      sentry-major:
        patterns:
          - "@sentry/*"
          - "@sentry-internal/*"
        update-types:
          - "major"
      testing-major:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@playwright/test"
        update-types:
          - "major"
      dev-tooling-major:
        patterns:
          - "@biomejs/biome"
          - "knip"
          - "turbo"
          - "husky"
          - "lint-staged"
          - "tsx"
          - "tsdown"
          - "babel-plugin-react-compiler"
          - "openapi-typescript"
          - "openapi-fetch"
        update-types:
          - "major"
    ignore:
      # Ignore updates for packages that require manual migration
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Enable security updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # TODO: update to your GitHub username
    assignees:
      - "nnorx"
    labels:
      - "dependencies"
      - "github-actions"
